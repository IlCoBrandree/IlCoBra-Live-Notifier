
name: TikTok Live IlCoBra

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiktok-live-monitor
  cancel-in-progress: false

jobs:
  check-live:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa TikTokLive
        run: pip install TikTokLive

      - name: Controlla live TikTok
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tiktok_monitor.py

      - name: Salva stato live
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiktok_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna stato TikTok"
            git push
          fi
          
